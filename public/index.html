<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f8">
  <meta name="description" content="词流英语学习记录与复习工具">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="词流">
  <meta name="format-detection" content="telephone=no">
  <title>词流</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=1.8.2">
</head>
<body class="is-booting">
  <div class="boot-screen" id="boot-screen" aria-label="正在打开词流">
    <div class="boot-lockup">
      <span class="boot-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <strong>词流</strong>
      <small>wordflow</small>
    </div>
  </div>

  <section class="login-screen" id="login-screen" aria-labelledby="login-title" hidden>
    <header class="login-brand">
      <strong>词流</strong>
      <small>wordflow</small>
    </header>
    <div class="login-content">
      <div class="login-heading">
        <p>WELCOME BACK</p>
        <h1 id="login-title">继续学习</h1>
        <span>回到你的词流。</span>
      </div>
      <form class="login-form" id="login-form">
        <label class="login-field">
          <i data-lucide="user-round"></i>
          <span class="sr-only">账号</span>
          <input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="账号" required>
        </label>
        <label class="login-field">
          <i data-lucide="lock-keyhole"></i>
          <span class="sr-only">密码</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="密码" required>
          <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码" title="显示密码">
            <i data-lucide="eye"></i>
          </button>
        </label>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="login-submit" id="login-submit" type="submit">
          <span>进入词流</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>
    </div>
    <p class="login-footer">WORD BY WORD · DAY BY DAY</p>
  </section>

  <div class="app-shell" id="app-shell" hidden>
    <header class="topbar">
      <a class="brand" href="#today" aria-label="词流首页">
        <span class="brand-mark" aria-hidden="true"><i data-lucide="audio-lines"></i></span>
        <span class="brand-copy"><strong>词流</strong><small>wordflow</small><span id="review-feedback" role="status" hidden></span></span>
      </a>
      <div class="topbar-actions">
        <button class="icon-button" id="audio-settings-button" type="button" aria-label="发音设置" title="发音设置">
          <i data-lucide="headphones"></i>
        </button>
        <button class="icon-button primary-icon" id="add-button" type="button" aria-label="添加词句" title="添加词句">
          <i data-lucide="plus"></i>
        </button>
      </div>
    </header>

    <nav class="app-nav" aria-label="主导航">
      <button class="nav-item active" type="button" data-view="today">
        <i data-lucide="house"></i>
        <span>今日</span>
      </button>
      <button class="nav-item" type="button" data-view="library">
        <i data-lucide="notebook-tabs"></i>
        <span>词句</span>
      </button>
      <button class="nav-item" type="button" data-view="progress">
        <i data-lucide="chart-no-axes-combined"></i>
        <span>进度</span>
      </button>
    </nav>

    <main id="app-main" tabindex="-1">
      <section class="view active" id="today-view" aria-label="学习"></section>
      <section class="view" id="library-view" aria-labelledby="library-title"></section>
      <section class="view" id="progress-view" aria-labelledby="progress-title"></section>
    </main>
  </div>

  <dialog class="item-dialog" id="item-dialog">
    <form method="dialog" class="dialog-frame" id="item-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow" id="dialog-eyebrow">新内容</p>
          <h2 id="dialog-title">添加词句</h2>
        </div>
        <button class="icon-button" type="button" id="close-dialog" aria-label="关闭" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>

      <input type="hidden" id="item-id">
      <label class="field">
        <span>英文</span>
        <textarea id="item-term" rows="2" maxlength="500" required placeholder="Erase all content"></textarea>
      </label>
      <label class="field">
        <span>中文核心义</span>
        <textarea id="item-meaning" rows="2" maxlength="500" required placeholder="抹掉所有内容"></textarea>
      </label>

      <details class="advanced-editor" id="item-advanced">
        <summary>
          <span><i data-lucide="sliders-horizontal"></i>更多信息</span>
          <small id="item-advanced-summary">可选</small>
          <i data-lucide="chevron-down"></i>
        </summary>
        <div class="advanced-editor-content">
          <label class="field">
            <span>音标（可选）</span>
            <input id="item-phonetic" maxlength="120" placeholder="/ɪˈreɪs/">
          </label>

          <div class="field-grid">
            <label class="field">
              <span>类型</span>
              <select id="item-kind">
                <option value="word">单词</option>
                <option value="phrase">短语</option>
                <option value="sentence">句子</option>
              </select>
            </label>
            <label class="field">
              <span>范围</span>
              <select id="item-module" aria-label="词句分类"></select>
            </label>
          </div>

          <details class="component-editor" id="component-editor">
            <summary>
              <span>构词拆解（可选）</span>
              <i data-lucide="chevron-down"></i>
            </summary>
            <p>只记录能可靠解释整体词义的单词、前缀、词根或后缀。</p>
            <div class="component-editor-rows" id="component-editor-rows"></div>
            <button class="component-add-button" id="add-component" type="button">
              <i data-lucide="plus"></i>
              添加片段
            </button>
          </details>

          <label class="field">
            <span>例句或上下文</span>
            <textarea id="item-example" rows="2" maxlength="1000" placeholder="可留空"></textarea>
          </label>
          <label class="field">
            <span>来源</span>
            <input id="item-source" maxlength="200" placeholder="例如：iPhone 设置">
          </label>
          <label class="field"><span>原文链接（可选）</span><input id="item-source-url" type="url" maxlength="2048" placeholder="https://www.reddit.com/..."></label>
          <label class="field"><span>补充／关键关系（可选）</span><textarea id="item-note" rows="3" maxlength="1000"></textarea></label>
        </div>
      </details>

      <div class="dialog-actions">
        <button class="text-button danger-button hidden" id="delete-item" type="button">
          <i data-lucide="trash-2"></i>
          删除
        </button>
        <span class="action-spacer"></span>
        <button class="text-button secondary-button" id="cancel-dialog" type="button">取消</button>
        <button class="text-button primary-button" type="submit">
          <i data-lucide="check"></i>
          保存
        </button>
      </div>
    </form>
  </dialog>

  <dialog class="item-dialog audio-dialog" id="audio-dialog">
    <form method="dialog" class="dialog-frame" id="audio-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">LISTENING</p>
          <h2>发音与听力</h2>
        </div>
        <button class="icon-button" type="button" id="close-audio-dialog" aria-label="关闭" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>

      <fieldset class="settings-group">
        <legend>英语口音</legend>
        <div class="settings-segment" id="accent-options">
          <button type="button" data-accent="en-US">美式</button>
          <button type="button" data-accent="en-GB">英式</button>
        </div>
      </fieldset>

      <label class="range-field" for="speech-rate">
        <span><strong>语速</strong><output id="speech-rate-value">0.85×</output></span>
        <input id="speech-rate" type="range" min="0.65" max="1.15" step="0.05" value="0.85">
        <span class="range-labels"><small>慢</small><small>自然</small></span>
      </label>

      <label class="toggle-row">
        <span>
          <strong>下一张自动播放</strong>
          <small>手动播放一次后生效</small>
        </span>
        <input id="speech-autoplay" type="checkbox" role="switch">
      </label>

      <div class="account-row" id="account-row" hidden>
        <span class="account-state"><i data-lucide="shield-check"></i><strong>已登录</strong></span>
        <button class="logout-button" id="logout-button" type="button">
          <i data-lucide="log-out"></i>
          退出登录
        </button>
      </div>

      <div class="dialog-actions audio-dialog-actions">
        <button class="text-button listen-preview-button" id="speech-preview" type="button">
          <i data-lucide="volume-2"></i>
          试听
        </button>
        <span class="action-spacer"></span>
        <button class="text-button primary-button" id="save-audio-settings" type="button">完成</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="item-dialog" id="learning-details-dialog">
    <div class="dialog-frame">
      <div class="dialog-header"><h2>学习详情</h2><button class="icon-button" id="close-learning-details" type="button" aria-label="关闭学习详情"><i data-lucide="x"></i></button></div>
      <div id="learning-details-body"></div>
    </div>
  </dialog>
  <dialog class="item-dialog" id="draft-dialog">
    <form class="dialog-frame" id="draft-form">
      <div class="dialog-header"><h2 id="draft-title">收藏工作原句</h2><button class="icon-button" id="close-draft" type="button" aria-label="关闭原句窗口"><i data-lucide="x"></i></button></div>
      <p class="draft-hint">原句先保存为待整理，核对中文解释后才能加入练习。这里不自动翻译。</p>
      <label class="field"><span>工作原句</span><textarea id="draft-text" rows="4" maxlength="500" required placeholder="粘贴一小段 Reddit 原句"></textarea></label>
      <label class="field"><span>原文链接（可选）</span><input id="draft-source-url" type="url" maxlength="2048" placeholder="https://www.reddit.com/..."></label>
      <div id="draft-reference" hidden>
        <label class="field"><span>核对后的中文参考解释</span><textarea id="draft-meaning" rows="3" maxlength="500"></textarea></label>
        <label class="field"><span>关键关系（可选）</span><textarea id="draft-note" rows="3" maxlength="1000" placeholder="人物、动作、否定、条件、指代"></textarea></label>
      </div>
      <div class="dialog-actions"><button class="text-button primary-button" id="save-draft" type="submit">收藏，稍后整理</button><button class="text-button primary-button" id="publish-draft" type="button" hidden>已核对，加入练习</button></div>
    </form>
  </dialog>
  <script src="./vendor/lucide/lucide.min.js"></script>
  <script type="module" src="./app.js?v=1.8.2"></script>
</body>
</html>
